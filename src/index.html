<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Track Your Travel Expenses - Voyage Ledger</title>
  <base href="/" />
  <!-- Apply the saved theme before first paint; the landing page is prerendered in light mode. -->
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Icons: .ico for older browsers and crawlers that only check /favicon.ico, SVG for modern
       browsers, a 192px PNG for Google Search (it wants a square multiple of 48px), and the
       Apple touch icon (full-bleed, no rounded corners; iOS applies its own mask). -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/svg+xml" href="/assets/logo-v2-rupee.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <meta name="description"
    content="All-in-one travel companion that combines trip mapping with collaborative expense tracking. Invite your travel group, split costs together, and always know who owes who." />

  <link rel="canonical" href="https://www.voyageledger.in/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Voyage Ledger" />
  <meta property="og:title" content="Voyage Ledger - Track Your Journey, Master Your Budget" />
  <meta property="og:description"
    content="All-in-one travel companion that combines trip mapping with collaborative expense tracking. Invite your travel group, split costs together, and always know who owes who." />
  <meta property="og:url" content="https://www.voyageledger.in" />
  <meta property="og:image" content="https://www.voyageledger.in/assets/og-image.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Voyage Ledger - Track Your Journey, Master Your Budget" />
  <meta name="twitter:description"
    content="All-in-one travel companion that combines trip mapping with collaborative expense tracking. Invite your travel group, split costs together, and always know who owes who." />
  <meta name="twitter:image" content="https://www.voyageledger.in/assets/og-image.png" />
</head>

<body>

</body>

</html>
